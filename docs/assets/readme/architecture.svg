<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">GResume system architecture</title>
  <desc id="desc">A clean hand-drawn architecture diagram with a local-first browser workspace, optional Supabase services and the DeepSeek API reached through an Edge Function.</desc>

  <defs>
