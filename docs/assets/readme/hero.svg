<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">GResume workflow overview</title>
  <desc id="desc">A hand-drawn engineering notebook illustration showing a base resume entering GResume, then branching into versioned sharing and job tracking.</desc>

  <defs>
    <pattern id="paperDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#D9D2C3" opacity="0.42" />
    </pattern>
  </defs>

  <rect x="8" y="8" width="1184" height="544" rx="30" fill="#FFFDF7" stroke="#1F2328" stroke-width="3" />
  <rect x="17" y="17" width="1166" height="526" rx="23" fill="url(#paperDots)" stroke="#1F2328" stroke-width="1.2" stroke-dasharray="7 11" opacity="0.8" />

