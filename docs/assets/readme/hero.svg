  <path d="M793 342C822 354 835 369 857 389" stroke="#1F2328" stroke-width="4" stroke-linecap="round" />
  <path d="M851 373L860 392L840 389" stroke="#1F2328" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
