<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">GResume tailor and share sequence</title>
  <desc id="desc">A clean hand-drawn sequence diagram showing how a candidate tailors a resume, reviews AI suggestions and publishes a fixed share snapshot.</desc>

  <defs>
    <pattern id="paperDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#D9D2C3" opacity="0.36" />
    </pattern>
    <marker id="arrowInk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L7 4.5L1 8" fill="none" stroke="#1F2328" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L7 4.5L1 8" fill="none" stroke="#2F6BFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <rect x="8" y="8" width="1184" height="604" rx="28" fill="#FFFDF7" stroke="#1F2328" stroke-width="3" />
  <rect x="17" y="17" width="1166" height="586" rx="21" fill="url(#paperDots)" stroke="#1F2328" stroke-width="1" stroke-dasharray="7 11" opacity="0.8" />

  <text x="48" y="52" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="800" letter-spacing="1.2">SEQUENCE / TAILOR → REVIEW → SHARE</text>
  <path d="M48 68C186 58 332 58 470 69" stroke="#D4A72C" stroke-width="3" stroke-linecap="round" />
  <path d="M832 35Q832 27 841 27L1136 29Q1145 29 1145 38L1143 72Q1143 81 1134 81L841 79Q832 79 832 70Z" fill="#F6E8A9" stroke="#1F2328" stroke-width="2.2" />
  <text x="858" y="57" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="800">CLOUD STEPS RUN AFTER SIGN-IN</text>

  <!-- Actors -->
  <path d="M65 104Q65 94 76 94L244 96Q255 96 255 107L253 161Q253 172 242 172L76 170Q65 170 65 159Z" fill="#FFFFFF" stroke="#1F2328" stroke-width="2.8" />
  <circle cx="96" cy="132" r="12" fill="#E8EEFF" stroke="#1F2328" stroke-width="2" />
  <circle cx="96" cy="128" r="4" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.5" />
  <path d="M89 140Q96 133 103 140" stroke="#1F2328" stroke-width="1.5" stroke-linecap="round" />
  <text x="124" y="139" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800">CANDIDATE</text>

  <path d="M330 104Q330 94 341 94L519 96Q530 96 530 107L528 161Q528 172 517 172L341 170Q330 170 330 159Z" fill="#F8FAFF" stroke="#1F2328" stroke-width="2.8" />
  <path d="M358 116H384V145H358Z" fill="#E8EEFF" stroke="#1F2328" stroke-width="2" />
  <text x="405" y="139" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800">BROWSER APP</text>

  <path d="M650 104Q650 94 661 94L839 96Q850 96 850 107L848 161Q848 172 837 172L661 170Q650 170 650 159Z" fill="#F2F8F3" stroke="#1F2328" stroke-width="2.8" />
  <ellipse cx="681" cy="124" rx="17" ry="7" fill="#E2F1E5" stroke="#1F2328" stroke-width="1.8" />
  <path d="M664 124V143C664 148 672 151 681 151C690 151 698 148 698 143V124" stroke="#1F2328" stroke-width="1.8" />
  <text x="721" y="139" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800">SUPABASE</text>

  <path d="M945 104Q945 94 956 94L1124 96Q1135 96 1135 107L1133 161Q1133 172 1122 172L956 170Q945 170 945 159Z" fill="#FFF9E8" stroke="#1F2328" stroke-width="2.8" />
  <path d="M973 118H1003M973 129H1010M973 140H997" stroke="#D4A72C" stroke-width="2.8" stroke-linecap="round" />
  <text x="1028" y="139" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="800">MODEL PROXY</text>

  <!-- Lifelines -->
  <path d="M160 171V550" stroke="#858B94" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 8" />
  <path d="M430 171V550" stroke="#858B94" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 8" />
  <path d="M750 171V550" stroke="#858B94" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 8" />
  <path d="M1040 171V550" stroke="#858B94" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 8" />

  <!-- Step 1 -->
  <text x="196" y="207" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">1. choose resume + target JD</text>
  <path d="M160 220H430" stroke="#1F2328" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrowInk)" />

  <!-- Step 2 -->
  <text x="488" y="260" fill="#2F6BFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="800">2. load signed-in context</text>
  <path d="M430 273H750" stroke="#2F6BFF" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arrowBlue)" />

  <!-- Step 3 -->
  <text x="594" y="313" fill="#2F6BFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="800">3. request ATS-aware suggestions</text>
  <path d="M430 326H1040" stroke="#2F6BFF" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arrowBlue)" />

  <!-- Step 4 -->
  <text x="661" y="366" fill="#575D66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">4. stream suggestions for review</text>
  <path d="M1040 379H430" stroke="#2F6BFF" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arrowBlue)" />

  <!-- Step 5 -->
  <text x="205" y="419" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">5. confirm selected edits</text>
  <path d="M160 432H430" stroke="#1F2328" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrowInk)" />

  <!-- Step 6 -->
  <text x="476" y="472" fill="#2F6BFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="800">6. save version + fixed snapshot</text>
  <path d="M430 485H750" stroke="#2F6BFF" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arrowBlue)" />

  <!-- Step 7 -->
  <text x="311" y="525" fill="#575D66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">7. return controlled share URL</text>
  <path d="M750 538H160" stroke="#1F2328" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arrowInk)" />

  <!-- Footer note -->
  <path d="M356 558Q356 552 363 552L837 554Q844 554 844 561L842 588Q842 595 835 595L363 593Q356 593 356 586Z" fill="#FFF9E8" stroke="#D4A72C" stroke-width="1.8" />
  <text x="425" y="579" fill="#575D66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">AI suggestions never bypass user confirmation</text>
</svg>
