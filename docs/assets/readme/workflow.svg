  <!-- Arrow 3 -->
  <path d="M865 135C886 126 900 126 921 136" stroke="#1F2328" stroke-width="3.5" stroke-linecap="round" />
  <path d="M909 124L925 136L908 146" stroke="#1F2328" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Step 4 -->
  <g transform="rotate(1 1039 132)">
    <path d="M926 59Q926 46 939 46L1140 49Q1153 49 1153 63L1150 207Q1150 220 1136 220L939 217Q926 217 926 204Z" fill="#FFFFFF" stroke="#1F2328" stroke-width="3.5" />
    <circle cx="966" cy="91" r="21" fill="#E2F1E5" stroke="#1F2328" stroke-width="2.5" />
    <text x="955" y="98" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="800">04</text>
    <text x="1002" y="98" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" font-weight="800">TRACK</text>
    <path d="M957 130H1118M957 154H1118M957 178H1118" stroke="#858B94" stroke-width="2.4" stroke-linecap="round" />
    <circle cx="978" cy="130" r="7" fill="#2F6BFF" />
    <circle cx="1038" cy="154" r="7" fill="#D4A72C" />
    <circle cx="1096" cy="178" r="7" fill="#397A4C" />
    <path d="M982 132C1001 141 1018 147 1032 153M1044 156C1061 163 1077 169 1090 177" stroke="#1F2328" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 5" />
    <text x="957" y="202" fill="#575D66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">keep the next action visible</text>
  </g>

  <path d="M81 35C105 25 135 26 158 35" stroke="#D4A72C" stroke-width="3" stroke-linecap="round" />
  <path d="M1060 233C1081 223 1107 225 1128 236" stroke="#2F6BFF" stroke-width="3" stroke-linecap="round" />
  <text x="446" y="258" fill="#575D66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">one resume model • traceable versions • clear next actions</text>
</svg>
