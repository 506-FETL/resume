<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">GResume four-step workflow</title>
  <desc id="desc">A hand-drawn workflow showing Write, Tailor, Share and Track as four connected steps.</desc>

  <rect x="8" y="8" width="1184" height="264" rx="28" fill="#FFFDF7" stroke="#1F2328" stroke-width="3" />
  <path d="M36 237C211 248 395 239 578 245C765 251 964 239 1165 246" stroke="#D9D2C3" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 10" />

  <!-- Step 1 -->
  <g transform="rotate(-1 161 132)">
    <path d="M43 63Q43 50 56 50L257 53Q270 53 270 67L267 203Q267 216 253 216L56 213Q43 213 43 200Z" fill="#FFFFFF" stroke="#1F2328" stroke-width="3.5" />
    <path d="M50 69Q49 58 61 58L249 60" stroke="#2F6BFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 7" />
    <circle cx="83" cy="91" r="21" fill="#E8EEFF" stroke="#1F2328" stroke-width="2.5" />
    <text x="72" y="98" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="800">01</text>
    <text x="119" y="98" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" font-weight="800">WRITE</text>
    <path d="M74 129H235M74 150H217M74 171H238" stroke="#858B94" stroke-width="4" stroke-linecap="round" opacity="0.58" />
    <text x="74" y="198" fill="#575D66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">build the source resume</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M278 135C299 126 313 126 334 136" stroke="#1F2328" stroke-width="3.5" stroke-linecap="round" />
  <path d="M322 124L338 136L321 146" stroke="#1F2328" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Step 2 -->
  <g transform="rotate(1 451 132)">
    <path d="M338 59Q338 46 351 46L552 49Q565 49 565 63L562 207Q562 220 548 220L351 217Q338 217 338 204Z" fill="#FFFFFF" stroke="#1F2328" stroke-width="3.5" />
    <circle cx="378" cy="91" r="21" fill="#F6E8A9" stroke="#1F2328" stroke-width="2.5" />
    <text x="367" y="98" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="800">02</text>
    <text x="414" y="98" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" font-weight="800">TAILOR</text>
    <path d="M369 127H471" stroke="#858B94" stroke-width="4" stroke-linecap="round" />
    <path d="M369 147H527" stroke="#D4A72C" stroke-width="8" stroke-linecap="round" opacity="0.27" />
    <path d="M369 146C413 151 474 143 528 148" stroke="#D4A72C" stroke-width="3" stroke-linecap="round" />
    <path d="M369 169H495" stroke="#858B94" stroke-width="4" stroke-linecap="round" />
    <text x="369" y="199" fill="#575D66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">derive from the target JD</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M571 135C592 126 606 126 627 136" stroke="#1F2328" stroke-width="3.5" stroke-linecap="round" />
  <path d="M615 124L631 136L614 146" stroke="#1F2328" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Step 3 -->
  <g transform="rotate(-1 746 132)">
    <path d="M632 63Q632 50 645 50L846 53Q859 53 859 67L856 203Q856 216 842 216L645 213Q632 213 632 200Z" fill="#FFFFFF" stroke="#1F2328" stroke-width="3.5" />
    <circle cx="672" cy="91" r="21" fill="#E8EEFF" stroke="#1F2328" stroke-width="2.5" />
    <text x="661" y="98" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="800">03</text>
    <text x="708" y="98" fill="#1F2328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" font-weight="800">SHARE</text>
    <path d="M675 143C690 128 708 128 720 140C732 152 731 170 718 182" stroke="#2F6BFF" stroke-width="4" stroke-linecap="round" />
    <path d="M771 143C756 128 738 128 726 140C714 152 715 170 728 182" stroke="#2F6BFF" stroke-width="4" stroke-linecap="round" />
    <path d="M706 157H740" stroke="#1F2328" stroke-width="3" stroke-linecap="round" />
