<style>
  .demo-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
    margin-top: 22px;
  }

  .style-card {
    overflow: hidden;
    border: 1px solid #e4e4e7;
    border-radius: 14px;
    background: #fff;
    cursor: pointer;
    transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
  }

  .style-card:hover {
    transform: translateY(-2px);
    border-color: #a1a1aa;
    box-shadow: 0 12px 28px rgb(24 24 27 / 8%);
  }

  .resume-preview {
    position: relative;
    min-height: 270px;
    padding: 30px 22px;
    overflow: hidden;
    color: #18181b;
    background: linear-gradient(145deg, #fafafa, #f4f4f5);
  }

  .paper {
    min-height: 185px;
    padding: 21px 20px;
    border: 1px solid #e4e4e7;
    border-radius: 8px;
    background: white;
    box-shadow: 0 4px 14px rgb(24 24 27 / 5%);
  }

  .resume-title {
    width: 45%;
    height: 8px;
    margin-bottom: 16px;
    border-radius: 999px;
    background: #27272a;
  }

  .text-row {
    height: 6px;
    margin-top: 9px;
    border-radius: 999px;
    background: #d4d4d8;
  }

  .text-row.short { width: 72%; }
  .text-row.mid { width: 87%; }

  .selected-line {
    width: 91%;
    height: 12px;
    margin-top: 10px;
    border-radius: 2px;
    background: #bfdbfe;
  }

  .floating {
    position: absolute;
    right: 29px;
    top: 119px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    white-space: nowrap;
    font-size: 13px;
    font-weight: 500;
    animation: float-in 1.8s cubic-bezier(.16, 1, .3, 1) infinite;
  }

  .floating svg { width: 15px; height: 15px; }

  .option-a .floating {
    height: 34px;
    padding: 0 13px;
    border-radius: 7px;
    color: #fafafa;
    background: #18181b;
    box-shadow: 0 4px 12px rgb(24 24 27 / 16%);
  }

  .option-b .floating {
    height: 36px;
    padding: 0 13px;
    border: 1px solid #e4e4e7;
    border-radius: 8px;
    color: #18181b;
    background: rgb(255 255 255 / 96%);
    box-shadow: 0 8px 24px rgb(24 24 27 / 10%), 0 1px 2px rgb(24 24 27 / 5%);
  }

  .option-c .floating {
    height: 38px;
    padding: 0 14px;
    border: 1px solid rgb(255 255 255 / 12%);
    border-radius: 10px;
    color: #fafafa;
    background: rgb(24 24 27 / 94%);
    box-shadow: 0 10px 28px rgb(24 24 27 / 24%);
    backdrop-filter: blur(8px);
  }

  .card-copy { padding: 16px 17px 18px; }
  .card-copy h3 { margin: 0 0 5px; font-size: 15px; }
  .card-copy p { margin: 0; color: #71717a; font-size: 13px; line-height: 1.55; }

  .recommended {
    display: inline-flex;
    margin-left: 6px;
    padding: 2px 6px;
    border-radius: 999px;
    color: #1d4ed8;
    background: #dbeafe;
    font-size: 10px;
    font-weight: 600;
    vertical-align: 1px;
  }

  @keyframes float-in {
    0%, 12% { opacity: 0; transform: translateY(6px) scale(.96); filter: blur(2px); }
    27%, 76% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    92%, 100% { opacity: 0; transform: translateY(3px) scale(.98); filter: blur(1px); }
  }

  @media (max-width: 900px) {
    .demo-grid { grid-template-columns: 1fr; }
  }
</style>

<h2>划词评论按钮：哪种 Shadcn 风格更合适？</h2>
<p class="subtitle">三种方案都将当前过大的黑色胶囊收紧为 32–38px，并演示淡入上浮 + 缩放、淡出下沉的进出动画。</p>

<div class="demo-grid">
  <article class="style-card option-a" data-choice="a" onclick="toggleSelect(this)">
    <div class="resume-preview">
      <div class="paper">
        <div class="resume-title"></div>
        <div class="text-row"></div>
        <div class="selected-line"></div>
        <div class="text-row mid"></div>
        <div class="text-row short"></div>
      </div>
      <div class="floating">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/><path d="M12 7v8M8 11h8"/></svg>
        评论
      </div>
    </div>
    <div class="card-copy">
      <h3>A · 紧凑默认按钮 <span class="recommended">推荐</span></h3>
      <p>最贴近 Shadcn Button 默认语言；层级明确、占位最小，和现有系统一致。</p>
    </div>
  </article>

  <article class="style-card option-b" data-choice="b" onclick="toggleSelect(this)">
    <div class="resume-preview">
      <div class="paper">
        <div class="resume-title"></div>
        <div class="text-row"></div>
        <div class="selected-line"></div>
        <div class="text-row mid"></div>
        <div class="text-row short"></div>
      </div>
      <div class="floating">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/><path d="M12 7v8M8 11h8"/></svg>
        评论
      </div>
    </div>
    <div class="card-copy">
      <h3>B · 浅色悬浮面板</h3>
      <p>更像 Popover / Toolbar；轻盈但在白色简历背景上需要更重的阴影保证辨识度。</p>
    </div>
  </article>

  <article class="style-card option-c" data-choice="c" onclick="toggleSelect(this)">
    <div class="resume-preview">
      <div class="paper">
        <div class="resume-title"></div>
        <div class="text-row"></div>
        <div class="selected-line"></div>
        <div class="text-row mid"></div>
        <div class="text-row short"></div>
      </div>
      <div class="floating">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/><path d="M12 7v8M8 11h8"/></svg>
        评论
      </div>
    </div>
    <div class="card-copy">
      <h3>C · 深色浮层</h3>
      <p>保留当前深色感但改为小圆角面板；更有存在感，也比 A 稍重一些。</p>
    </div>
  </article>
</div>
