name: Database contracts

on:
  pull_request:
    paths:
      - '.github/workflows/database.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/**'
      - 'src/features/resume-comments/**'
      - 'src/lib/automerge/**'
      - 'src/lib/supabase/**'
      - 'src/pages/resume/**'
      - 'supabase/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/database.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/**'
      - 'src/features/resume-comments/**'
      - 'src/lib/automerge/**'
      - 'src/lib/supabase/**'
      - 'src/pages/resume/**'
      - 'supabase/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-contracts:
    name: Fresh reset, pgTAP and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@a0853c24544627f65ddf259abe73b1d18a591444 # v5

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.3
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.111.0

      - name: Start fresh local database
        run: supabase db start

      - name: Replay migrations and run database contracts
        run: pnpm verify:database

      - name: Lint database objects
        run: supabase db lint --local --level warning --fail-on error

      - name: Verify Edge security contracts
        run: |
          pnpm run verify:comment-service
          pnpm run verify:edge-context
          pnpm run verify:edge-auth
          pnpm run verify:github-stars

      - name: Type-check application
        run: pnpm exec tsc -b --pretty false

      - name: Lint backend risk changes
        run: >-
          pnpm exec eslint
          scripts/verify-database-concurrency.ts
          scripts/verify-edge-request-context.ts
          scripts/verify-github-stars-cache.ts
          scripts/verify-resume-comment-service.ts
          scripts/verify-supabase-edge-auth.ts
          supabase/functions/shared/*.ts
          supabase/functions/llm-proxy/index.ts
          supabase/functions/github-stars-refresh/core.ts
          supabase/functions/github-stars-refresh/index.ts
          supabase/functions/resume-share/index.ts
          supabase/functions/resume-comments/index.ts
          src/features/resume-comments/api/cache.ts
          src/features/resume-comments/api/client.ts
          src/features/resume-comments/context.tsx
          src/features/resume-comments/hooks/use-comment-realtime.ts
          src/lib/automerge/document/manager.ts
          src/lib/automerge/document/persistence.ts
          src/lib/supabase/quota.ts
          src/lib/supabase/github-stars.ts
          src/components/animate-ui/primitives/animate/github-stars.tsx
          src/components/dashboard/site-header.tsx
          src/pages/resume/editor/components/collaboration/collaboration-controls/index.tsx
          src/pages/resume/editor/components/collaboration/index.tsx
          src/pages/resume/editor/hooks/use-collaboration-panel-value.ts
          src/pages/resume/editor/hooks/use-comment-review-mode.ts
          src/pages/resume/editor/hooks/use-resume-loader.ts
          src/pages/resume/editor/index.tsx
          src/store/resume/slices/document.ts
          --no-warn-ignored

      - name: Build production bundle
        run: pnpm build
